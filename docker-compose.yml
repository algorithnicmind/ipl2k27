services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ciap-postgres
    environment:
      POSTGRES_USER: ciap_user
      POSTGRES_PASSWORD: ciap_password
      POSTGRES_DB: ciap_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciap_user -d ciap_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ciap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
